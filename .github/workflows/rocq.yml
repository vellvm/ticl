name: Docker CI

on:
  push:
    branches:
      - master
      - main
      - lang/yield
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rocq_version:
          - '9.2'
        ocaml_version:
          - '4.14-flambda'
      max-parallel: 4
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          opam_file: 'rocq-ticl.opam'
          coq_version: ${{ matrix.rocq_version }}
          ocaml_version: ${{ matrix.ocaml_version }}
          before_install: |
            startGroup "Configure toolchain"
              opam pin remove -n -y rocq-stdlib
              opam pin add -n -y dune 3.23.1
            endGroup
          export: 'OPAMWITHTEST'
        env:
          OPAMWITHTEST: 'true'

